<!DOCTYPE html>
<html>
<head>
   <!--

      Script that populates an array of places, and outputs values to page.
   -->
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
   <title>Hands-on Project 3-3</title>
   <link rel="stylesheet" href="styles.css" />
   <script src="modernizr.custom.05819.js"></script>
</head>

<body>
   <header>
      <h1>
         Hands-on Project 3-3
      </h1>
   </header>

   <article>
      <h2>Scouting Locations</h2>
      <div id="results">
          <ul>
             <li id="item1"></li>
             <li id="item2"></li>
             <li id="item3"></li>
             <li id="item4"></li>
             <li id="item5"></li>
          </ul>
      </div>
   </article>
   <script>
      // global variable places
      var places = ["Reading", "Pottsville", "Harrisburg", "Philadelphia", "Minersville"]

      // processPlaces function loops through array and sets list item html to current place value
      function processPlaces() {
         for (i = 0; i < places.length; i++) {
            var listItem = "item" + (i + 1);
            document.getElementById(listItem).innerHTML = places[i];
         }
      }

      // add event listener, or attach event in older browsers
      if (window.addEventListener) {
         window.addEventListener("load", processPlaces, false);
      } else if (window.attachEvent) {
         window.attachEvent("onload", processPlaces);
      }
   </script>
</body>
</html>
