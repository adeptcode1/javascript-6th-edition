<!DOCTYPE html>
<html>
<head>
   <!--

      Script allows input of five items, displays items in list. Display thank you message when 5 items entered.
      Modified Hands-on Project 3-4 to utilize switch instead of if statements.
   -->
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
   <title>Hands-on Project 3-5</title>
   <link rel="stylesheet" href="styles.css" />
   <script src="modernizr.custom.05819.js"></script>
</head>

<body>
   <header>
      <h1>
         Hands-on Project 3-5
      </h1>
   </header>

   <article>
      <div id="results">
          <ul>
             <li id="item1"></li>
             <li id="item2"></li>
             <li id="item3"></li>
             <li id="item4"></li>
             <li id="item5"></li>
          </ul>
          <p id="resultsExpl"></p>
      </div>
      <form>
          <fieldset>
            <label for="toolBox" id="placeLabel">
              Type the name of a tool, then click Submit:
            </label>
            <input type="text" id="toolBox" />
          </fieldset>
          <fieldset>
            <button type="button" id="button">Submit</button>
          </fieldset>
      </form>
   </article>
   <script>
      // create global variables
      var i = 1;
      var listItem = "";

      function processInput() {
         // process item, if less than 5 by outputting to list. Clear input. if 5th item, thank user.
         /*if (i <= 5) {
            listItem = "item" + i;
            document.getElementById(listItem).innerHTML = document.getElementById("toolBox").value;
            document.getElementById("toolBox").value = "";
            if (i === 5) {
               document.getElementById("resultsExpl").innerHTML = "Thanks for your suggestions";
            }
            // be sure to increment counter
            i++;
         }*/
         switch (i) {
            case 5:
               listItem = "item" + i;
               document.getElementById(listItem).innerHTML = document.getElementById("toolBox").value;
               document.getElementById("toolBox").value = "";
               document.getElementById("resultsExpl").innerHTML = "Thanks for your suggestions";
               //disable button after 5th item
               document.getElementById("button").disabled = true;
               break;
            default:
               listItem = "item" + i;
               document.getElementById(listItem).innerHTML = document.getElementById("toolBox").value;
               document.getElementById("toolBox").value = "";
               break;

         }
         i++;
      }

      // add event listener, or attach event in older browsers
      if (document.getElementById("button").addEventListener) {
         document.getElementById("button").addEventListener("click", processInput, false);
      } else if (document.getElementById("button").attachEvent) {
         document.getElementById("button").attachEvent("onclick", processInput);
      }
   </script>
</body>
</html>
